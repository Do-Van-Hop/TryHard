<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo-List</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="todo-container">
        <h1 id="main-title">Danh sách công việc hôm nay</h1>
        
        <div class="content">
            <ul class="todo-list">
                <li class="morning">
                    <input type="checkbox" id="task1">
                    <label for="task1">Chạy bộ 5km</label>
                </li>
                <li class="morning">
                    <input type="checkbox" id="task2">
                    <label for="task2">Vệ sinh cá nhân</label>
                </li>
                <li class="morning">
                    <input type="checkbox" id="task3">
                    <label for="task3">Ăn sáng</label>
                </li>
                <li class="morning important">
                    <input type="checkbox" id="task4">
                    <label for="task4">Đi thực hành lập trình Script</label>
                </li>
                <li class="afternoon">
                    <input type="checkbox" id="task5">
                    <label for="task5">Ăn trưa</label>
                </li>
                <li class="afternoon important">
                    <input type="checkbox" id="task6">
                    <label for="task6">Học môn lập trình Script</label>
                </li>
                <li class="evening important">
                    <input type="checkbox" id="task7">
                    <label for="task7">Nộp bài lên gít trước khi ngủ</label>
                </li>
                <li class="evening">
                    <input type="checkbox" id="task8">
                    <label for="task8">Chuẩn bị đồ đi học ngày mai</label>
                </li>
                <li class="evening important">
                    <input type="checkbox" id="task9">
                    <label for="task9">Nhắn tin cho bạn gái</label>
                </li>
            </ul>
        </div>
        
        <p class="note" data-type="reminder">*Ghi nhớ: Kỷ luật là sức mạnh !*</p>
    </div>
</body>
</html>
